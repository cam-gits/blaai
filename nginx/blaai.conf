#Recover the real client IP from the edge proxy, which is the only thing that can reach this container.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# Off, not on: the edge appends the true client IP to the end of the header, so the last entry is trustworthy.
real_ip_recursive off;

# Rate limit keyed by client IP
limit_req_zone $binary_remote_addr zone=blaa:10m rate=10r/m;

# Concurrent connections per client IP. 
limit_conn_zone $binary_remote_addr zone=blaaconn:10m;

server {
    listen 80;
    server_name _;

    # Static frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        limit_req zone=blaa burst=5 nodelay;

        # Streamed answers hold a connection open for the length of generation, prevents excess parallel generation
        limit_conn blaaconn 3;

        # A question is a short string. 
        client_max_body_size 16k;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Generation on CPU outlasts the 60s default
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Required for streamed token responses — do not buffer.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}