# Rate limit keyed by client IP
limit_req_zone $binary_remote_addr zone=blaa:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Static frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        limit_req zone=blaa burst=5 nodelay;

        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Required for streamed token responses — do not buffer.
        proxy_buffering off;
        proxy_cache off;
    }
}