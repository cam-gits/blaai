<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlaAI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h1 class="logo" aria-label="blaai.ie">
  <span class="b">B</span><span class="l">l</span><span class="a">a</span><span class="a2">a</span><span class="i">i</span><span class="ie">.ie</span>
  </h1>

  <p class="muted">Ask about Waterford council services.</p>
  <input id="q" type="text" placeholder="e.g. How do I report a pothole?" />
  <button id="send">Ask</button>
  <div id="answer"></div>

  <script>
    const q = document.getElementById("q");
    const answer = document.getElementById("answer");

    document.getElementById("send").addEventListener("click", async () => {
      const question = q.value.trim();
      if (!question) return;
      answer.textContent = "…";
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        answer.textContent = data.answer ?? JSON.stringify(data);
      } catch (e) {
        answer.textContent = "Error: " + e.message;
      }
    });
  </script>
</body>
</html>
