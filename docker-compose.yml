services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.2
    ports:
      - "127.0.0.1:${WEAVIATE_HTTP_PORT}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT}:50051"
    environment:
      CLUSTER_HOSTNAME: 'node1'
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      ENABLE_MODULES: 'text2vec-ollama'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-ollama'
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: ./api
    env_file: .env
    environment:
      - WEAVIATE_HOST=weaviate
    depends_on:
      weaviate:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    restart: unless-stopped

  # Fronted by the shared edge proxy (separate compose project)
  nginx:
    image: nginx:1.27-alpine
    environment:
      VIRTUAL_HOST: ${BLAAI_DOMAIN}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${BLAAI_DOMAIN}
    expose:
      - "80"
    volumes:
      - ./nginx/blaai.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - edge

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Keep models resident indefinitely instead of the 5m default.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull embeddinggemma:latest && ollama pull phi4-mini:3.8b-q4_K_M"]
    restart: "no"

  # Run with:  docker compose run --rm scraper
  scraper:
    build: ./scraper
    profiles: ["jobs"]
    env_file: .env
    depends_on:
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

  ingest:
    build: ./ingest
    profiles: ["jobs"]
    env_file: .env
    environment:
      - WEAVIATE_HOST=weaviate
    depends_on:
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

volumes:
  weaviate_data:
  ollama_data:

networks:
  edge:
    external: true
